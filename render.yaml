# Render Blueprint for the live ReceptWise control panel.
# NOT applied yet. Creating these (both on the free plan) waits until PK's keys are in hand.
services:
  - type: web
    name: receptwise-portal
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: receptwise-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
      - key: SMS_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_VOICE_ID
        sync: false
      - key: VAPI_CALENDAR_TOOL_IDS
        sync: false
      - key: TRANSFER_TO_NUMBER
        sync: false

databases:
  - name: receptwise-db
    plan: free
    # Free Render Postgres expires 30 days after creation (14-day grace, then deleted). No backups.
